<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setter Tracker — Nauči Dizajn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Raptor TTF';
            src: url('https://cdn.prod.website-files.com/6114c0249ef45bc2232a4788/65bd4838ea5e3885f0b9cad3_RaptorText-Regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Raptor TTF';
            src: url('https://cdn.prod.website-files.com/6114c0249ef45bc2232a4788/65bd48495f1bb18bfc54cdee_RaptorText-Medium.ttf') format('truetype');
            font-weight: 500;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Raptor TTF';
            src: url('https://cdn.prod.website-files.com/6114c0249ef45bc2232a4788/65bd485bae2da4cbc7c48d2d_RaptorText-SemiBold.ttf') format('truetype');
            font-weight: 600;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --olive-100: #797d73;
            --olive-200: #3d403c;
            --olive-300: #313330;
            --olive-400: #232421;
            --bg-dark: #232421;
            --bg-card: #313330;
            --bg-card-hover: #3d403c;
            --fluorescent: #DBFF00;
            --fluorescent-dim: rgba(219, 255, 0, 0.15);
            --fluorescent-glow: rgba(219, 255, 0, 0.3);
            --text-primary: #fff;
            --text-secondary: lightgrey;
            --text-muted: #797d73;
            --neutral: #fff;
            --merino: #f2efe6;
            --border: rgba(255, 255, 255, 0.08);
            --border-active: rgba(255, 255, 255, 0.15);
            --danger: #ff4d4f;
            --success: #4cb06c;
            --radius: 12px;
            --radius-lg: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        ::selection {
            background: var(--fluorescent);
            color: var(--olive-400);
        }

        /* No ambient gradient — flat dark bg like naucidizajn.com */

        /* ── Login Screen ── */
        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .login-logo {
            height: 28px;
            margin-bottom: 12px;
        }

        .login-card .logo {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--fluorescent);
            margin-bottom: 8px;
        }

        .login-card h1 {
            font-family: 'Raptor TTF', 'Plus Jakarta Sans', sans-serif;
            font-size: 32px;
            font-weight: 500;
            margin-bottom: 32px;
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .setter-btn {
            display: block;
            width: 100%;
            padding: 16px;
            margin-bottom: 12px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        .setter-btn:hover {
            border-color: var(--fluorescent);
            background: var(--fluorescent-dim);
            transform: translateY(-1px);
        }

        .setter-btn.owner {
            border-color: var(--fluorescent);
            background: rgba(219, 255, 0, 0.08);
        }

        .setter-btn.owner:hover {
            background: rgba(219, 255, 0, 0.15);
        }

        .setter-btn .avatar {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--fluorescent);
            color: var(--bg-dark);
            font-weight: 800;
            font-size: 14px;
            margin-right: 12px;
            vertical-align: middle;
            overflow: hidden;
            flex-shrink: 0;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 24px 0;
            color: var(--text-muted);
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* owner-btn removed, using .setter-btn.owner instead */

        /* ── App Layout ── */
        .app { display: none; position: relative; z-index: 1; }
        .app.active { display: block; }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 32px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-card);
            backdrop-filter: none;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .topbar-logo {
            height: 22px;
        }

        .topbar .brand {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--fluorescent);
        }

        .topbar-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
        }

        .topbar-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .topbar .user-info {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .topbar .user-info strong {
            color: var(--text-primary);
        }

        .btn-logout {
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 16px;
            color: var(--text-secondary);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-logout:hover {
            border-color: var(--danger);
            color: var(--danger);
        }

        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px;
        }

        /* ── Setter Entry Form ── */
        .form-header {
            margin-bottom: 32px;
        }

        .form-header h2 {
            font-family: 'Raptor TTF', 'Plus Jakarta Sans', sans-serif;
            font-size: 36px;
            font-weight: 600;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-header .date {
            font-size: 15px;
            color: var(--text-secondary);
        }

        .date-picker-row {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-top: 8px;
        }

        .entry-date-input {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 16px;
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 15px;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .entry-date-input:focus { border-color: var(--fluorescent); }
        .entry-date-input::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }

        .date-display {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .metric-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            transition: all 0.2s;
        }

        .metric-card:focus-within {
            border-color: var(--border-active);
            background: var(--bg-card-hover);
        }

        .metric-card label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .metric-card input {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 32px;
            font-weight: 700;
            outline: none;
        }

        .metric-card input::placeholder {
            color: var(--text-muted);
        }

        .metric-card input[type="number"]::-webkit-inner-spin-button,
        .metric-card input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
        }

        .metric-card input[type="number"] { -moz-appearance: textfield; }

        .metric-card.auto-calc {
            border-color: rgba(219, 255, 0, 0.15);
            background: rgba(219, 255, 0, 0.05);
        }

        .metric-card.auto-calc .calc-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--fluorescent);
        }

        .metric-card.auto-calc .calc-value.danger { color: var(--danger); }
        .metric-card.auto-calc .calc-value.success { color: var(--success); }

        .btn-submit {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 16px 40px;
            background: var(--fluorescent);
            border: none;
            border-radius: var(--radius);
            color: var(--bg-dark);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-submit:hover {
            transform: translateY(-1px);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .submit-feedback {
            margin-top: 16px;
            padding: 12px 20px;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 600;
            display: none;
        }

        .submit-feedback.success {
            display: block;
            background: rgba(77, 255, 136, 0.1);
            color: var(--success);
            border: 1px solid rgba(77, 255, 136, 0.2);
        }

        .submit-feedback.error {
            display: block;
            background: rgba(255, 77, 77, 0.1);
            color: var(--danger);
            border: 1px solid rgba(255, 77, 77, 0.2);
        }

        /* ── PIN Modal ── */
        .pin-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.97);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .pin-overlay.active { display: flex; }
        .pin-modal {
            background: var(--bg-card);
            border: 1px solid var(--accent);
            border-radius: 16px;
            padding: 36px 32px;
            width: 320px;
            max-width: 90vw;
            text-align: center;
            box-shadow: 0 12px 48px rgba(0,0,0,0.6);
        }
        .pin-modal h3 {
            margin-bottom: 20px;
            color: var(--text);
            font-size: 1.1rem;
        }
        .pin-modal input {
            width: 100%;
            padding: 14px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-size: 1.5rem;
            text-align: center;
            letter-spacing: 12px;
            font-family: inherit;
            outline: none;
            box-sizing: border-box;
        }
        .pin-modal input:focus { border-color: var(--accent); }
        .pin-error {
            color: var(--danger);
            font-size: 0.85rem;
            margin-top: 8px;
            min-height: 20px;
        }
        .pin-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }
        .pin-cancel, .pin-submit {
            flex: 1;
            padding: 12px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .pin-cancel {
            background: var(--bg-card);
            color: var(--text-muted);
        }
        .pin-submit {
            background-color: #DBFF00 !important;
            color: #232421 !important;
            border-color: #DBFF00 !important;
            font-weight: 700;
            font-size: 0.95rem;
        }
        .pin-submit:hover {
            opacity: 0.9;
        }

        /* ── Topbar right group ── */
        .topbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ── Leaderboard Badge (topbar) ── */
        .lb-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            background: rgba(219, 255, 0, 0.08);
            border: 1px solid var(--accent);
            border-radius: 50px;
            color: var(--accent);
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .lb-badge:hover {
            background: rgba(219, 255, 0, 0.14);
        }
        .lb-badge svg { flex-shrink: 0; }
        .lb-badge-avatar {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            object-fit: cover;
        }
        .lb-badge-leader {
            color: var(--text);
            font-weight: 600;
            white-space: nowrap;
            font-size: 0.82rem;
        }
        .lb-badge-leader strong {
            color: var(--accent);
        }

        /* ── Leaderboard Modal ── */
        .lb-modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.15s ease;
        }
        .lb-modal-overlay.active {
            display: flex;
        }
        .lb-modal {
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 16px;
            width: 90%;
            max-width: 480px;
            padding: 28px;
            animation: slideUp 0.2s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .lb-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .lb-modal-header h3 {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text);
        }
        .lb-modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.15s;
        }
        .lb-modal-close:hover {
            color: var(--text);
            background: var(--bg-card);
        }
        .lb-modal-sub {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }
        .lb-modal-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .lb-modal-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 18px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }
        .lb-modal-row.is-first {
            border-color: var(--accent);
            background: rgba(219, 255, 0, 0.05);
        }
        .lb-modal-row.is-me {
            box-shadow: inset 3px 0 0 var(--accent);
        }
        .lb-modal-rank {
            font-size: 1.3rem;
            font-weight: 800;
            min-width: 28px;
            text-align: center;
        }
        .lb-modal-rank.rank-1 { color: #FFD700; }
        .lb-modal-rank.rank-2 { color: #C0C0C0; }
        .lb-modal-rank.rank-3 { color: #CD7F32; }
        .lb-modal-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
        }
        .lb-modal-info { flex: 1; }
        .lb-modal-name {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text);
        }
        .lb-modal-detail {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 2px;
        }
        .lb-modal-value {
            text-align: right;
        }
        .lb-modal-number {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--text);
            line-height: 1;
        }
        .lb-modal-row.is-first .lb-modal-number {
            color: var(--accent);
        }
        .lb-modal-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ── Leaderboard (inline) ── */
        .leaderboard-section {
            margin-top: 48px;
            padding-top: 32px;
            border-top: 1px solid var(--border);
        }
        .leaderboard-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 4px;
        }
        .leaderboard-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }
        .leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .lb-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            transition: all 0.2s;
        }
        .lb-row.is-me {
            border-color: var(--accent);
            background: rgba(219, 255, 0, 0.04);
        }
        .lb-rank {
            font-size: 1.4rem;
            font-weight: 800;
            min-width: 32px;
            text-align: center;
            color: var(--text-muted);
        }
        .lb-row.is-me .lb-rank {
            color: var(--accent);
        }
        .lb-rank-1 { color: #FFD700 !important; }
        .lb-rank-2 { color: #C0C0C0 !important; }
        .lb-rank-3 { color: #CD7F32 !important; }
        .lb-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }
        .lb-info {
            flex: 1;
        }
        .lb-name {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text);
        }
        .lb-row.is-me .lb-name::after {
            content: ' (ti)';
            font-weight: 400;
            color: var(--accent);
            font-size: 0.8rem;
        }
        .lb-detail {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 2px;
        }
        .lb-value {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text);
            min-width: 48px;
            text-align: right;
        }
        .lb-bar-wrap {
            flex: 1;
            max-width: 200px;
            height: 6px;
            background: var(--bg-input);
            border-radius: 3px;
            overflow: hidden;
        }
        .lb-bar {
            height: 100%;
            border-radius: 3px;
            background: var(--accent);
            transition: width 0.6s ease;
        }

        /* ── Owner Dashboard ── */
        .dashboard-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 32px;
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 4px;
            border: 1px solid var(--border);
            width: fit-content;
        }

        .tab-btn {
            padding: 10px 24px;
            background: transparent;
            border: none;
            border-radius: 8px;
            color: var(--text-secondary);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--fluorescent);
            color: var(--bg-dark);
        }

        .tab-btn:hover:not(.active) {
            color: var(--text-primary);
        }

        /* Overview Cards */
        .setter-overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .setter-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 28px;
            transition: all 0.2s;
        }

        .setter-card:hover {
            border-color: var(--border-active);
        }

        .setter-card-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 24px;
        }

        .setter-card-header .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--fluorescent);
            color: var(--bg-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 16px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .setter-card-header .avatar img,
        .setter-btn .avatar img,
        .topbar .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .setter-card-header .name {
            font-size: 18px;
            font-weight: 700;
        }

        .setter-card-header .status {
            margin-left: auto;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
        }

        .status.submitted {
            background: rgba(77, 255, 136, 0.1);
            color: var(--success);
        }

// STATE & CONFIG

const SETTERS = ['Lazar', 'Ana'];
const SETTER_PHOTOS = {

const METRICS = [

    { key: 'conversations', label: 'Conversations' },
    { key: 'booked_calls', label: 'Booked Calls' },
    { key: 'conversion_rate', label: 'Conversion %' },
];

// ── Supabase Config ──
const SUPABASE_URL = 'https://jtgrlixywcxabellqyxm.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp0Z3JsaXh5d2N4YWJlbGxxeXhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQzNjQwNTgsImV4cCI6MjA4OTk0MDA1OH0.ymv2an4JUwm0H4y_GmaEvwI7q-Yhq2I0GwacYPojnvI';

const SB_HEADERS = {
    'apikey': SUPABASE_KEY,
    'Authorization': `Bearer ${SUPABASE_KEY}`,
    'Content-Type': 'application/json',
    'Prefer': 'return=representation'
};

async function sbGet(table, query = '') {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${query}`, { headers: SB_HEADERS });
    if (!res.ok) throw new Error(`Supabase GET error: ${res.status}`);
    return res.json();
}

async function sbUpsert(table, data, onConflict = 'user_name,date') {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?on_conflict=${onConflict}`, {
        method: 'POST',
        headers: { ...SB_HEADERS, 'Prefer': 'return=representation,resolution=merge-duplicates' },
        body: JSON.stringify(data)
    });
    if (!res.ok) {
        const err = await res.text();
        console.error('Supabase UPSERT error:', res.status, err);
        throw new Error(`Supabase UPSERT error: ${res.status}`);
    }
    return res.json();
}

let currentUser = null;
let chartInstance = null;

// ── Database layer (Supabase-backed, with local cache) ──
let dbCache = null;
let dbCacheTime = 0;
const CACHE_TTL = 5000; // 5 seconds

async function loadDBAsync() {
    const now = Date.now();
    if (dbCache && (now - dbCacheTime < CACHE_TTL)) return dbCache;

    const entries = await sbGet('daily_entries', 'select=*&order=date.asc');
    const db = {};
    SETTERS.forEach(s => { db[s] = []; });
    entries.forEach(e => {
        if (db[e.user_name]) db[e.user_name].push(e);
    });
    dbCache = db;
    dbCacheTime = now;
    return db;
}

// Synchronous fallback using cache
function loadDB() {
    if (dbCache) return dbCache;
    const db = {};
    SETTERS.forEach(s => { db[s] = []; });
    return db;
}

function invalidateCache() {
    dbCache = null;
    dbCacheTime = 0;
}

let demoData = loadDB();

function formatDate(d) {
    return d.toISOString().split('T')[0];
}

function formatDateDisplay(d) {
    const opts = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
    return (d || new Date()).toLocaleDateString('sr-Latn', opts);
}

let pendingLoginUser = null;

function showPinPrompt(name) {
    pendingLoginUser = name;
    document.getElementById('pinTitle').textContent = `PIN za ${name}`;
    document.getElementById('pinInput').value = '';
    document.getElementById('pinError').textContent = '';
    document.getElementById('pinOverlay').classList.add('active');
    const pinInput = document.getElementById('pinInput');
    setTimeout(() => pinInput.focus(), 100);
}

function closePinPrompt() {
    document.getElementById('pinOverlay').classList.remove('active');
    pendingLoginUser = null;
}

async function verifyPin() {
    const pin = document.getElementById('pinInput').value;
    if (!pin || !pendingLoginUser) return;

    try {
        const users = await sbGet('users', `select=pin,role&name=eq.${pendingLoginUser}`);
        if (users.length === 0 || users[0].pin !== pin) {
            document.getElementById('pinError').textContent = 'Pogrešan PIN';
            document.getElementById('pinInput').value = '';
            document.getElementById('pinInput').focus();
            return;
        }
        const userName = pendingLoginUser;
        closePinPrompt();

function getWeeklyLeaderboardData() {
    const db = loadDB();
    const now = new Date();
    const dow = now.getDay();
    const diffToMon = dow === 0 ? 6 : dow - 1;
    const monday = new Date(now);
    monday.setDate(now.getDate() - diffToMon);
    monday.setHours(0,0,0,0);
    const sunday = new Date(monday);
    sunday.setDate(monday.getDate() + 6);
    const monStr = formatDate(monday);
    const sunStr = formatDate(sunday);

    const results = SETTERS.map(setter => {
        const entries = (db[setter] || []).filter(e => e.date >= monStr && e.date <= sunStr);
        const booked = entries.reduce((s, e) => s + (e.booked_calls || 0), 0);
        const convos = entries.reduce((s, e) => s + (e.conversations || 0), 0);
        const rate = convos > 0 ? Math.round((booked / convos) * 100) : 0;
        return { name: setter, booked, convos, rate, days: entries.length };
    });
    results.sort((a, b) => b.booked - a.booked);
    return results;
}

function renderLeaderboard() {
    const results = getWeeklyLeaderboardData();
    const maxBooked = Math.max(...results.map(r => r.booked), 1);

    // Update topbar badge
    const leader = results[0];
    const badgeLeaderEl = document.getElementById('lbBadgeLeader');
    const badgeAvatarEl = document.getElementById('lbBadgeAvatar');
    if (badgeLeaderEl) {
        badgeLeaderEl.innerHTML = `${leader.name} · ${leader.booked}`;
    }
    if (badgeAvatarEl) {
        badgeAvatarEl.src = SETTER_PHOTOS[leader.name];

    // Inline leaderboard (bottom of form)
    const container = document.getElementById('leaderboardList');
    container.innerHTML = results.map((r, i) => {
        const rank = i + 1;
        const isMe = r.name === currentUser;
        const barWidth = Math.round((r.booked / maxBooked) * 100);
        const rankClass = rank <= 3 ? `lb-rank-${rank}` : '';
        return `
        <div class="lb-row ${isMe ? 'is-me' : ''}">
            <div class="lb-rank ${rankClass}">${rank}</div>
            <img src="${SETTER_PHOTOS[r.name]}" alt="${r.name}" class="lb-avatar">
            <div class="lb-info">
                <div class="lb-name">${r.name}</div>

function calcRate() {
    const conversations = parseInt(document.getElementById('m_conversations').value) || 0;
    const booked = parseInt(document.getElementById('m_booked_calls').value) || 0;
    const el = document.getElementById('conversionRate');

    if (conversations === 0) {
        el.textContent = '—';
        el.className = 'calc-value';
        return;
    }

    const rate = Math.round((booked / conversations) * 100);
    el.textContent = rate + '%';

    if (rate >= 25) {
        el.className = 'calc-value success';
    } else if (rate < 10) {
        el.className = 'calc-value danger';
    } else {
        el.className = 'calc-value';
    }
}

async function submitEntry() {
    const btn = document.getElementById('btnSubmit');
    btn.disabled = true;
    btn.textContent = 'Šaljem...';

    const selectedDate = document.getElementById('entryDate').value;
    const payload = {
        setter: currentUser,
        date: selectedDate,
        outbound_new: parseInt(document.getElementById('m_outbound_new').value) || 0,
        outbound_votes: parseInt(document.getElementById('m_outbound_votes').value) || 0,
        follow_ups: parseInt(document.getElementById('m_follow_ups').value) || 0,
        quiz_leads: parseInt(document.getElementById('m_quiz_leads').value) || 0,
        conversations: parseInt(document.getElementById('m_conversations').value) || 0,
        booked_calls: parseInt(document.getElementById('m_booked_calls').value) || 0,
    };

    payload.conversion_rate = payload.conversations > 0
        ? Math.round((payload.booked_calls / payload.conversations) * 100)
        : 0;

    try {
        // Save to Supabase (upsert on user_name + date)
        await sbUpsert('daily_entries', {
            user_name: currentUser,
            date: payload.date,
            outbound_new: payload.outbound_new,
            outbound_votes: payload.outbound_votes,
            follow_ups: payload.follow_ups,
            quiz_leads: payload.quiz_leads,
            conversations: payload.conversations,
            booked_calls: payload.booked_calls,
            conversion_rate: payload.conversion_rate,
            updated_at: new Date().toISOString()
        });

        // Invalidate cache so fresh data is loaded
        invalidateCache();

        showFeedback('Izveštaj uspešno poslat!', 'success');
        btn.textContent = 'Poslato ✓';

        // Refresh leaderboard
        await loadDBAsync();
        renderLeaderboard();
    } catch (err) {
        showFeedback('Greška pri slanju. Pokušaj ponovo.', 'error');
        btn.disabled = false;
        btn.textContent = 'Pošalji izveštaj';
    }
}

function initComparisonDates() {
    const today = new Date();
    const weekAgo = new Date(today);
    weekAgo.setDate(weekAgo.getDate() - 7);
    document.getElementById('compFrom').value = formatDate(weekAgo);
    document.getElementById('compTo').value = formatDate(today);
}

function updateComparison() {
    const from = document.getElementById('compFrom').value;
    const to = document.getElementById('compTo').value;
    if (!from || !to) return;

    const body = document.getElementById('compBody');
    const metricKeys = METRICS.map(m => m.key);

    // Aggregate data per setter
    const agg = {};
    SETTERS.forEach(s => {
        agg[s] = {};
        metricKeys.forEach(k => { agg[s][k] = 0; agg[s][k + '_count'] = 0; });

        demoData[s].forEach(d => {
            if (d.date >= from && d.date <= to) {
                metricKeys.forEach(k => {
                    agg[s][k] += d[k];
                    agg[s][k + '_count']++;
                });
            }
        });
    });

    body.innerHTML = METRICS.map(m => {
        const vals = SETTERS.map(s => {
            if (m.key === 'conversion_rate') {
                const count = agg[s][m.key + '_count'];
                return count > 0 ? Math.round(agg[s][m.key] / count) : 0;
            }
            return agg[s][m.key];
        });

        const maxVal = Math.max(...vals);

        return `<tr>
            <td>${m.label}</td>
            ${SETTERS.map((s, i) => {
                const display = m.key === 'conversion_rate' ? vals[i] + '%' : vals[i];
                const isBest = vals[i] === maxVal && maxVal > 0;
                return `<td class="${isBest ? 'best' : ''}">${display}</td>`;
            }).join('')}
        </tr>`;
    }).join('');
}

let reportWeekOffset = 0; // 0 = last completed week, -1 = week before, etc.

function getWeekRange(offset) {
    const now = new Date();
    // Find last Monday (start of current week)
    const dayOfWeek = now.getDay(); // 0=Sun, 1=Mon...
    const daysSinceMonday = dayOfWeek === 0 ? 6 : dayOfWeek - 1;

    // Start of THIS week (Monday)
    const thisMonday = new Date(now);
    thisMonday.setDate(now.getDate() - daysSinceMonday);
    thisMonday.setHours(0, 0, 0, 0);

    // Default (offset=0) = last completed week (Monday to Sunday before this week)
    const weekStart = new Date(thisMonday);
    weekStart.setDate(thisMonday.getDate() - 7 + (offset * 7));
    const weekEnd = new Date(weekStart);
    weekEnd.setDate(weekStart.getDate() + 6);

    return { start: weekStart, end: weekEnd };
}

function getWeekDays(weekRange) {
    const days = [];
    for (let i = 0; i < 7; i++) {
        const d = new Date(weekRange.start);
        d.setDate(weekRange.start.getDate() + i);
        days.push(d);
    }
    return days;
}

const DAY_NAMES_SHORT = ['pon', 'uto', 'sre', 'čet', 'pet', 'sub', 'ned'];

function changeReportWeek(dir) {
    reportWeekOffset += dir;
    if (reportWeekOffset > 0) reportWeekOffset = 0; // can't go to future
    renderWeeklyReport();
}

function renderWeeklyReport() {
    const week = getWeekRange(reportWeekOffset);
    const days = getWeekDays(week);
    const dayStrings = days.map(d => formatDate(d));

    const opts = { day: 'numeric', month: 'short' };
    document.getElementById('weekLabel').textContent =
        `${week.start.toLocaleDateString('sr-Latn', opts)} — ${week.end.toLocaleDateString('sr-Latn', opts)}, ${week.end.getFullYear()}`;

    const container = document.getElementById('weeklyReportContent');
    const db = loadDB();

    let hasAnyData = false;
    let grandTotals = { leads: 0, follow_ups: 0, conversations: 0, booked_calls: 0 };

    const setterData = SETTERS.map(setter => {
        const entries = db[setter] || [];
        const weekEntries = dayStrings.map(ds => entries.find(e => e.date === ds) || null);
        const validEntries = weekEntries.filter(e => e !== null);
        if (validEntries.length > 0) hasAnyData = true;

        const leads = validEntries.reduce((s, e) => s + (e.outbound_new || 0) + (e.outbound_votes || 0) + (e.quiz_leads || 0), 0);
        const follow_ups = validEntries.reduce((s, e) => s + (e.follow_ups || 0), 0);
        const conversations = validEntries.reduce((s, e) => s + (e.conversations || 0), 0);
        const booked_calls = validEntries.reduce((s, e) => s + (e.booked_calls || 0), 0);
        const convRate = conversations > 0 ? Math.round((booked_calls / conversations) * 100) : 0;

        grandTotals.leads += leads;
        grandTotals.follow_ups += follow_ups;
        grandTotals.conversations += conversations;
        grandTotals.booked_calls += booked_calls;

        return { setter, weekEntries, validEntries, days, leads, follow_ups, conversations, booked_calls, convRate };
    });

    if (!hasAnyData) {
        container.innerHTML = `<div class="no-report-data">Nema podataka za ovu nedelju.</div>`;
        return;
    }

    const grandConvRate = grandTotals.conversations > 0 ? Math.round((grandTotals.booked_calls / grandTotals.conversations) * 100) : 0;

    // Team total section
    let html = `
    <div class="report-setter-section report-team-total">
        <div class="report-setter-header">
            <div class="name">Ukupno (svi setteri)</div>
        </div>
        <div class="report-summary-grid report-4col">
            <div class="report-summary-stat">
                <div class="stat-num">${grandTotals.leads}</div>
                <div class="stat-lbl">Leadovi</div>
            </div>
            <div class="report-summary-stat">
                <div class="stat-num">${grandTotals.follow_ups}</div>
                <div class="stat-lbl">Follow Ups</div>
            </div>
            <div class="report-summary-stat">
                <div class="stat-num">${grandTotals.conversations}</div>
                <div class="stat-lbl">Konverzacije</div>
            </div>
            <div class="report-summary-stat">
                <div class="stat-num" style="color: var(--accent)">${grandTotals.booked_calls}</div>
                <div class="stat-lbl">Booked Calls</div>
            </div>
        </div>
        <div style="text-align:center;color:var(--text-muted);font-size:0.85rem;margin-top:8px;">
            Conversion rate: <strong style="color:var(--accent)">${grandConvRate}%</strong>
        </div>
    </div>`;

    // Per-setter sections
    html += setterData.map(sd => {
        const { setter, weekEntries, validEntries, leads, follow_ups, conversations, booked_calls, convRate } = sd;

        // Daily booked calls grid
        const dailyCells = weekEntries.map((entry, i) => {
            const dayName = DAY_NAMES_SHORT[i];
            const dayNum = days[i].getDate();
            if (!entry) {
                return `<div class="report-day-cell no-data">
                    <div class="day-name">${dayName} ${dayNum}.</div>
                    <div class="day-val">—</div>
                </div>`;
            }
            return `<div class="report-day-cell">
                <div class="day-name">${dayName} ${dayNum}.</div>
                <div class="day-val">${entry.booked_calls}</div>
            </div>`;
        }).join('');

        // Insights
        const insights = generateInsights(setter, weekEntries, days, validEntries, booked_calls);

        return `
        <div class="report-setter-section">
            <div class="report-setter-header">
                <div class="avatar"><img src="${SETTER_PHOTOS[setter]}" alt="${setter}"></div>
                <div class="name">${setter}</div>
            </div>

            <div class="report-summary-grid report-4col">
                <div class="report-summary-stat">
                    <div class="stat-num">${leads}</div>

                </div>
                <div class="report-summary-stat">

                    <div class="stat-lbl">Follow Ups</div>
                </div>
                <div class="report-summary-stat">
                    <div class="stat-num">${conversations}</div>
                    <div class="stat-lbl">Konverzacije</div>
                </div>
                <div class="report-summary-stat">
                    <div class="stat-num" style="color: var(--accent)">${booked_calls}</div>
                    <div class="stat-lbl">Booked Calls</div>
                </div>
            </div>
            <div style="text-align:center;color:var(--text-muted);font-size:0.85rem;margin-top:8px;">
                Conversion rate: <strong style="color:var(--accent)">${convRate}%</strong>
            </div>

            <div class="report-daily-grid">${dailyCells}</div>

            ${insights.length > 0 ? `
            <div class="report-insights">
                <h4>Zapažanja</h4>
                ${insights.map(ins => `
                    <div class="insight-item">
                        <span class="insight-icon">${ins.icon}</span>
                        <span>${ins.text}</span>
                    </div>
                `).join('')}
            </div>` : ''}
        </div>`;
    }).join('');

    container.innerHTML = html;
}

function generateInsights(setter, weekEntries, days, validEntries, totalBooked) {
    const insights = [];
    if (validEntries.length === 0) return insights;

    const dayLabels = days.map(d => d.toLocaleDateString('sr-Latn', { weekday: 'long', day: 'numeric', month: 'long' }));

    // Best day
    let bestDay = null, bestVal = -1;
    weekEntries.forEach((e, i) => {
        if (e && e.booked_calls > bestVal) { bestVal = e.booked_calls; bestDay = i; }
    });
    if (bestDay !== null && bestVal > 0) {
        insights.push({
            icon: '⭐',
            text: `Najbolji dan: <strong>${dayLabels[bestDay]}</strong> — ${bestVal} booked calls`
        });
    }

    // Detect drops (0 after 2+)
    for (let i = 1; i < weekEntries.length; i++) {
        const prev = weekEntries[i - 1];
        const curr = weekEntries[i];
        if (prev && curr && prev.booked_calls >= 2 && curr.booked_calls === 0) {
            insights.push({
                icon: '🔴',
                text: `<strong>Pad</strong> u ${dayLabels[i]} — 0 booked calls (prethodni dan: ${prev.booked_calls}). Šta se desilo?`
            });
        }
    }

    // Detect drops in conversations
    for (let i = 1; i < weekEntries.length; i++) {
        const prev = weekEntries[i - 1];
        const curr = weekEntries[i];
        if (prev && curr && prev.conversations >= 4 && curr.conversations <= 1) {
            insights.push({
                icon: '📉',
                text: `Pad konverzacija u ${dayLabels[i]} (${curr.conversations} vs ${prev.conversations} dan ranije)`
            });
        }
    }

    // Missing days (Mon-Fri only)
    const missingWorkdays = [];
    weekEntries.forEach((e, i) => {
        if (i < 5 && e === null) missingWorkdays.push(DAY_NAMES_SHORT[i]);
    });
    if (missingWorkdays.length > 0) {
        insights.push({
            icon: '⚠️',
            text: `Nema izveštaja za: ${missingWorkdays.join(', ')}`
        });
    }

    return insights;
}
